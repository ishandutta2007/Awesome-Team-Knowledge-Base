<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(0.5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-0.5deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes pulseRing {
        0% { r: 6px; opacity: 0.9; }
        50% { r: 18px; opacity: 0.1; }
        100% { r: 6px; opacity: 0.9; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -80; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.2); }
      }

      .floating-node-1 { animation: float1 7s ease-in-out infinite; transform-origin: center; }
      .floating-node-2 { animation: float2 9s ease-in-out infinite; transform-origin: center; }
      .floating-node-3 { animation: float3 6s ease-in-out infinite; transform-origin: center; }
      .glow-pulse { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: center; }
      .dash-edge { stroke-dasharray: 6 6; animation: dashFlow 25s linear infinite; }
      .twinkle-star { animation: starTwinkle 4s ease-in-out infinite; transform-origin: center; }
      .twinkle-delay { animation-delay: 2s; }
      
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
      .pill-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.2; rx: 18; }
      
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 800; letter-spacing: -0.8px; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #94a3b8; letter-spacing: 0.2px; }
      .meta-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)"/>

  <!-- Subtle Matrix Dots / Grid -->
  <g opacity="0.12">
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#gridPattern)"/>
  </g>

  <!-- Dynamic Ambient Glow Spots (Background Layer) -->
  <circle cx="200" cy="80" r="140" fill="url(#glowGrad1)" filter="url(#glowBlur)" class="glow-pulse"/>
  <circle cx="1020" cy="280" r="160" fill="url(#glowGrad2)" filter="url(#glowBlur)" class="glow-pulse" style="animation-delay: -4s;"/>

  <!-- Dynamic Animated Graph Network Edges (Background Layer) -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.45" class="dash-edge">
    <line x1="80" y1="70" x2="220" y2="120"/>
    <line x1="220" y1="120" x2="350" y2="60"/>
    <line x1="980" y1="80" x2="1100" y2="150"/>
    <line x1="1050" y1="280" x2="920" y2="310"/>
    <line x1="160" y1="300" x2="280" y2="280"/>
  </g>

  <!-- Twinkling Micro Stars -->
  <circle cx="120" cy="210" r="2.5" fill="#38bdf8" class="twinkle-star"/>
  <circle cx="1080" cy="70" r="2.5" fill="#a855f7" class="twinkle-star twinkle-delay"/>
  <circle cx="600" cy="40" r="2" fill="#818cf8" class="twinkle-star"/>
  <circle cx="890" cy="220" r="2" fill="#38bdf8" class="twinkle-star twinkle-delay"/>

  <!-- Dynamic Floating Decorative Tags/Cards (Positioned in Corners to Keep Center Clear) -->
  <!-- Top Left Pill -->
  <g class="floating-node-1" transform="translate(60, 45)">
    <rect width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="35" y="23" class="pill-text">⚡ Open-Source Wikis</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-node-2" transform="translate(70, 275)">
    <rect width="175" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#10b981"/>
    <text x="35" y="23" class="pill-text">🛡️ Self-Hosted Docs</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-node-2" transform="translate(950, 50)">
    <rect width="185" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#a855f7"/>
    <text x="35" y="23" class="pill-text">☁️ Top SaaS Leaders</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-node-1" transform="translate(960, 275)">
    <rect width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#f59e0b"/>
    <text x="35" y="23" class="pill-text">🤝 Team Collaboration</text>
  </g>

  <!-- Center Floating Small Badge Pill -->
  <g class="floating-node-3" transform="translate(480, 50)">
    <rect width="240" height="30" rx="15" fill="#312e81" fill-opacity="0.6" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1"/>
    <text x="120" y="20" text-anchor="middle" class="meta-tag" fill="#a5b4fc">✨ 2026 Curated Ecosystem ✨</text>
  </g>

  <!-- Foreground Title and Content Group (Always in Foreground, Protected from Background Overlap) -->
  <g id="title-group" filter="url(#dropShadow)" text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="165" class="title-text" fill="url(#primaryTextGrad)">
      Awesome Team Knowledge Base
    </text>

    <!-- Subtitle -->
    <text x="600" y="208" class="sub-text">
      Curated Directory of Modern Team Wikis, Collaborative Docs &amp; Knowledge Systems
    </text>

    <!-- Meta Details Pills / Bottom Bar -->
    <g transform="translate(320, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.75" stroke="#4338ca" stroke-width="1"/>
      <text x="80" y="17" text-anchor="middle" class="meta-tag" fill="#c7d2fe">📊 Market Dynamics</text>
      
      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="26" rx="13" fill="#0f172a" fill-opacity="0.75" stroke="#0284c7" stroke-width="1"/>
      <text x="270" y="17" text-anchor="middle" class="meta-tag" fill="#7dd3fc">💰 Pricing &amp; Limits</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="180" height="26" rx="13" fill="#064e3b" fill-opacity="0.65" stroke="#059669" stroke-width="1"/>
      <text x="470" y="17" text-anchor="middle" class="meta-tag" fill="#6ee7b7">⭐ Star-Ranked OSS</text>
    </g>
  </g>
</svg>
