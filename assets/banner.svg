s dashFlow{0%{stroke-dashoffset:0}}@keyframes starTwinkle{0%{opacity:.2;transform:scale(.8)}50%{opacity:.9;transform:scale(1.2)}}.floating-node-1,.floating-node-2{animation:float1 7s ease-in-out infinite;transform-origin:center}.floating-node-2{animation:float2 9s ease-in-out infinite}.floating-node-3,.glow-pulse{animation:float3 6s ease-in-out infinite;transform-origin:center}.glow-pulse{animation:pulseGlow 8s ease-in-out infinite alternate}.dash-edge{stroke-dasharray:6 6;animation:dashFlow 25s linear infinite}.twinkle-star{animation:starTwinkle 4s ease-in-out infinite;transform-origin:center}.twinkle-delay{animation-delay:2s}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#cbd5e1}.title-text{font-size:48px;font-weight:800;letter-spacing:-.8px}.meta-tag,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.sub-text{font-size:18px;font-weight:400;fill:#94a3b8;letter-spacing:.2px}.meta-tag{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)"/><g opacity=".12"><pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#94a3b8"/></pattern><rect width="1200" height="360" fill="url(#gridPattern)"/></g><circle cx="200" cy="80" r="140" fill="url(#glowGrad1)" class="glow-pulse" filter="url(#glowBlur)"/><circle cx="1020" cy="280" r="160" fill="url(#glowGrad2)" class="glow-pulse" filter="url(#glowBlur)" style="animation-delay:-4s"/><g stroke="#475569" stroke-width="1.5" class="dash-edge" opacity=".45"><line x1="80" x2="220" y1="70" y2="120"/><line x1="220" x2="350" y1="120" y2="60"/><line x1="980" x2="1100" y1="80" y2="150"/><line x1="1050" x2="920" y1="280" y2="310"/><line x1="160" x2="280" y1="300" y2="280"/></g><circle cx="120" cy="210" r="2.5" fill="#38bdf8" c